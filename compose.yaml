services:
  app:
    build: .
    ports:
      - '3001:3001'
    environment:
      PORT: '3001'
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:3001}
      DATA_DIR: /data
      DATABASE_URL: postgres://flowline:flowline@postgres:5432/flowline
      REDIS_URL: redis://redis:6379
    volumes:
      - app-data:/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3001/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: flowline
      POSTGRES_PASSWORD: flowline
      POSTGRES_DB: flowline
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U flowline']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
volumes:
  app-data:
  postgres-data:
  redis-data:
